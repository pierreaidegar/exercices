<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Révis'Quiz</title>
  <meta name="description" content="Transforme tes photos de cours en questions pour réviser.">
  <meta name="theme-color" content="#f2ede3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Révis'Quiz">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4zM5 17a3 3 0 0 1 3-3h10"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="m4 16 5-5 4 4 2-2 5 5"/><circle cx="15.5" cy="9.5" r="1.3"/></symbol>
  </svg>

  <header class="topbar">
    <div class="logo">Révis<span>'</span>Quiz</div>
    <button class="icon-btn" id="btn-settings" aria-label="Réglages"><svg><use href="#i-gear"/></svg></button>
  </header>

  <main id="app">
    <!-- ===== Onglet Créer ===== -->
    <section class="view" id="view-creer">
      <div class="intro">
        <h1>Nouveau quiz</h1>
        <p>Photographie ton cours, je te prépare des questions.</p>
      </div>

      <div class="card note hidden" id="no-key-banner">
        <p>Avant de commencer, enregistre la clé dans les réglages.</p>
        <button class="btn small" id="btn-open-settings">Ouvrir les réglages</button>
      </div>

      <div class="card">
        <h2><span class="step">1</span> Tes photos <small id="photo-count">0/5</small></h2>
        <div class="photos" id="photos"></div>
        <div class="row">
          <label class="btn secondary" id="lbl-camera">
            <svg><use href="#i-camera"/></svg> Prendre une photo
            <input type="file" accept="image/*" capture="environment" id="input-camera" hidden>
          </label>
          <label class="btn secondary" id="lbl-gallery">
            <svg><use href="#i-image"/></svg> Galerie
            <input type="file" accept="image/*" multiple id="input-gallery" hidden>
          </label>
        </div>
      </div>

      <div class="card">
        <h2><span class="step">2</span> Les réglages</h2>
        <div class="grid-2">
          <div class="field">
            <label for="sel-matiere">Matière</label>
            <select id="sel-matiere"></select>
          </div>
          <div class="field">
            <label for="sel-niveau">Classe</label>
            <select id="sel-niveau">
              <option>6e</option><option>5e</option><option>4e</option><option>3e</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="inp-chapitre">Chapitre <small>facultatif</small></label>
          <input type="text" id="inp-chapitre" maxlength="80" placeholder="ex. La Révolution française">
        </div>
        <div class="field">
          <label for="rng-nombre">Nombre de questions <b id="nombre-val" class="value">10</b></label>
          <input type="range" id="rng-nombre" min="5" max="20" step="1" value="10">
        </div>
        <div class="field">
          <span class="label">Difficulté</span>
          <div class="chips" id="chips-difficulte">
            <button type="button" class="chip" data-value="facile"><i class="lvl"><b></b></i>Facile</button>
            <button type="button" class="chip active" data-value="moyen"><i class="lvl"><b></b><b></b></i>Moyen</button>
            <button type="button" class="chip" data-value="difficile"><i class="lvl"><b></b><b></b><b></b></i>Difficile</button>
          </div>
        </div>
      </div>

      <button class="btn big" id="btn-generer" disabled>Générer mes questions</button>
    </section>

    <!-- ===== Onglet Répondre ===== -->
    <section class="view hidden" id="view-repondre"></section>

    <!-- ===== Onglet Historique ===== -->
    <section class="view hidden" id="view-historique"></section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="creer"><svg><use href="#i-plus"/></svg>Créer</button>
    <button class="tab" data-view="repondre"><svg><use href="#i-pencil"/></svg>Répondre</button>
    <button class="tab" data-view="historique"><svg><use href="#i-book"/></svg>Historique</button>
  </nav>

  <!-- Chargement -->
  <div class="overlay hidden" id="loader">
    <div class="loader-box">
      <div class="dots"><i></i><i></i><i></i></div>
      <p id="loader-text">Je lis ton cours…</p>
    </div>
  </div>

  <!-- Réglages -->
  <div class="overlay hidden" id="settings">
    <div class="modal">
      <div class="modal-head">
        <h2>Réglages</h2>
        <button class="icon-btn" id="btn-close-settings" aria-label="Fermer"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="field">
        <label for="inp-key">Clé API Claude</label>
        <input type="password" id="inp-key" autocomplete="off" placeholder="sk-ant-…">
        <small>Elle reste uniquement dans cet appareil.</small>
      </div>
      <div class="row">
        <button class="btn small" id="btn-save-key">Enregistrer</button>
        <button class="btn small secondary" id="btn-test-key">Tester</button>
      </div>
      <p class="status" id="key-status"></p>
      <hr>
      <h3>Sauvegarde de l'historique</h3>
      <div class="row">
        <button class="btn small secondary" id="btn-export">Exporter</button>
        <label class="btn small secondary">Importer
          <input type="file" accept="application/json,.json" id="input-import" hidden>
        </label>
      </div>
      <p class="status" id="backup-status"></p>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="app.js"></script>
</body>
</html>
